[project]
name = "jev-opt"
version = "0.1.0"
description = "Optimize Jev decision programs with GEPA; all optimizer LLM calls routed through Oh My Pi"
requires-python = ">=3.11,<3.12"  # pinned: Python 3.12 changed float sum(); Score cutoffs are exact-comparison sensitive
dependencies = [
    "gepa==0.1.4",
    "pydantic>=2.7,<3",
    "pyyaml>=6,<7",
    "httpx>=0.27,<1",
    "numpy>=1.26,<3",
    "scipy>=1.11,<2",
    "scikit-learn>=1.4,<2",
    "sentence-transformers>=3,<6",
]

[project.scripts]
jev-opt-worker = "jev_opt.worker:main"

[dependency-groups]
dev = ["pytest>=8,<9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_opt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
