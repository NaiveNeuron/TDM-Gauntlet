# jev-tailored dev study (Jev-adapted GEPA), written by make_tailored_tasks.py from task_v3.yaml: same data,
# splits, metric, paper seed (the gauntlet prompt), 400-example stratified train fit slice, CV grouping and jev-
# native seeds (seeds_v3/, written from the task definition only). Ablation: start paper only, GEPA's default
# acceptance on 3-example minibatches (T2 off); everything else as task_tailored.yaml. OMP budget
# (max_reflection_cost) = the reflection spend of v1 study-contempo-tbdense-program ($2.1988); ablations: half
# of it, the paper start's share of the main run.
name: contempo-tbdense
labels:
  BEFORE: 'BEFORE: Event 1 happens before Event 2; Event 1 ends before Event 2 begins (including immediately before).'
  AFTER: 'AFTER: Event 1 happens after Event 2; Event 1 begins after Event 2 ends (including immediately after).'
  INCLUDES: 'INCLUDES: the time interval of Event 1 contains the time interval of Event 2; Event 2 happens during
    Event 1 (including Event 2 starting or ending Event 1).'
  IS_INCLUDED: 'IS_INCLUDED: the time interval of Event 1 is contained in the time interval of Event 2; Event 1
    happens during Event 2 (including Event 1 starting or ending Event 2).'
  SIMULTANEOUS: 'SIMULTANEOUS: Event 1 and Event 2 occupy the same time interval; they happen at the same time.'
  VAGUE: 'VAGUE: no specific relation above can be chosen with 80% confidence that it was the writer''s intent that
    a reader infer it; the text leaves the temporal relation between the two events underspecified.'
inputs:
  context: ''
  event_1: ''
  event_2: ''
negative_label: VAGUE
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: micro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 40000
  reflection_minibatch_size: 3
  use_merge: false
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: false
  readout_folds: 5
  readout_group: '^train:([^:]+):'
  fit_parameters: true
  max_reflection_cost: 1.1
  tailored:
    starts:
    - paper
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    rulebook: true
    continuous_accept: false
    accept_n: 64
    accept_tol: 0.02
    confusion_target: true
    minimal_pairs: 4
    max_examples: 8
    max_jev_cost: 1.0
    head: true
seed_program: seed.yaml
