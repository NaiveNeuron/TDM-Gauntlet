# v3 dev study (third pre-registration). Generated from task_v2_nodemo.yaml: same data, seed program
# (the gauntlet prompt, no demonstrations), metric, 400-example stratified train fit slice and val split.
# A = jev-zero with a readout head (L2 logistic regression; ridge + cutoffs for QWK) fitted on the fit slice,
#     hyperparameters by 5-fold CV grouped by documents (TimeBank-Dense pairs of one article share context).
# P = jev-population-opt from the union of the paper seed and 3 jev-native + 3 decomposed seeds written by
#     /jev-seeds from the task definition only (seeds_v3/); 4 rounds x 20 proposed variants (<=1500 chars
#     per text field, <=2 aux questions, optional kNN demonstrations), packed requests, train-CV scoring; val picks
#     among the 4 best programs (top-single) and their forward-selected stacks under one readout (top-stacked);
#     every seed is also scored zero-shot (top-zero-<kind>). Fresh Jev spend <= $2 per run.
name: contempo-tbdense
labels:
  BEFORE: 'BEFORE: Event 1 happens before Event 2; Event 1 ends before Event 2 begins (including immediately
    before).'
  AFTER: 'AFTER: Event 1 happens after Event 2; Event 1 begins after Event 2 ends (including immediately
    after).'
  INCLUDES: 'INCLUDES: the time interval of Event 1 contains the time interval of Event 2; Event 2 happens
    during Event 1 (including Event 2 starting or ending Event 1).'
  IS_INCLUDED: 'IS_INCLUDED: the time interval of Event 1 is contained in the time interval of Event 2;
    Event 1 happens during Event 2 (including Event 1 starting or ending Event 2).'
  SIMULTANEOUS: 'SIMULTANEOUS: Event 1 and Event 2 occupy the same time interval; they happen at the same
    time.'
  VAGUE: 'VAGUE: no specific relation above can be chosen with 80% confidence that it was the writer''s
    intent that a reader infer it; the text leaves the temporal relation between the two events underspecified.'
inputs:
  context: ''
  event_1: ''
  event_2: ''
negative_label: VAGUE
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: micro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 8900
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  fit_holdout: true
  reflection_pool: 100
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: true
  readout_folds: 5
  readout_group: '^train:([^:]+):'
  population:
    size: 20
    rounds: 4
    elite: 4
    worst_examples: 8
    max_aux: 2
    val_candidates: 4
    stack_max: 4
    demos:
      mode: knn
      k: 8
      balanced: true
    max_jev_cost: 2.0
    max_tokens: 32000
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-1.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-2.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-3.yaml
seed_program: seed.yaml
