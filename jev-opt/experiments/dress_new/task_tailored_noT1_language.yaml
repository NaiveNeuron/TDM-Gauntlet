# jev-tailored dev study (Jev-adapted GEPA), written by make_tailored_tasks.py from task_v3_language.yaml: same
# data, splits, metric, paper seed (the gauntlet prompt), 400-example stratified train fit slice, CV grouping
# and jev-native seeds (seeds_v3_language/, written from the task definition only). Ablation: start paper only,
# no rulebook (T1 off); everything else as task_tailored_language.yaml. OMP budget (max_reflection_cost) = the
# reflection spend of v1 study-dress-new-language-program ($3.6238); ablations: half of it, the paper start's
# share of the main run.
name: dress-new-language
labels:
  '1.0': '1.0 out of 5.0 (lowest score): the essay does not meet the language rubric explanation.'
  '1.5': 1.5 out of 5.0
  '2.0': 2.0 out of 5.0
  '2.5': 2.5 out of 5.0
  '3.0': '3.0 out of 5.0 (midpoint): the essay partly meets the language rubric explanation.'
  '3.5': 3.5 out of 5.0
  '4.0': 4.0 out of 5.0
  '4.5': 4.5 out of 5.0
  '5.0': '5.0 out of 5.0 (highest score): The writing displays sophisticated control of a wide range of vocabulary
    and collocations. The essay follows grammar and usage rules throughout the paper. Spelling and punctuation are
    correct throughout the paper.'
inputs:
  essay_prompt: ''
  essay: ''
ordinal: true
data:
  train: data/language/train.jsonl
  val: data/language/val.jsonl
  test: data/language/test.jsonl
primary_metric: qwk
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 40000
  reflection_minibatch_size: 3
  use_merge: false
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: false
  readout_folds: 5
  fit_parameters: true
  max_reflection_cost: 1.81
  tailored:
    starts:
    - paper
    seeds:
    - kind: jev-native
      path: seeds_v3_language/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3_language/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3_language/jev-native-3.yaml
    rulebook: false
    continuous_accept: true
    accept_n: 64
    accept_tol: 0.02
    confusion_target: true
    minimal_pairs: 4
    max_examples: 8
    max_jev_cost: 1.0
    head: true
seed_program: seed_language.yaml
