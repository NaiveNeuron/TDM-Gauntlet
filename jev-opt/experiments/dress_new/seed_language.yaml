# jev-zero seed = the gauntlet's frozen prompt (prompts/dress_new.json), verbatim; generated, do not hand-edit.
# One Score (question id `language`, the gauntlet's language question) over state {essay_prompt, essay}; the gauntlet asks all three rubrics in one request. cutoffs round the expected level (fitted on train in every condition).
version: 1
labels:
- '1.0'
- '1.5'
- '2.0'
- '2.5'
- '3.0'
- '3.5'
- '4.0'
- '4.5'
- '5.0'
inputs:
  essay_prompt: ''
  essay: ''
shared_state: false
temperature: 1.0
root: language
nodes:
  language:
    kind: score
    instructions: 'Please score the essay on the rubric LANGUAGE. The state holds an essay prompt ("essay_prompt")
      and an argumentative essay written in response to it ("essay") by an undergraduate English-as-a-foreign-language
      student during a 40-minute timed in-class writing test; the course instructor scores each essay
      on three rubrics (content, organization, and language) from 1.0 to 5.0 in increments of 0.5. The
      float values of scores are within [1.0, 1.5, 2.0, 2.5, 3.0, 3.5, 4.0, 4.5, 5.0]. Rubric explanation
      for language: "The writing displays sophisticated control of a wide range of vocabulary and collocations.
      The essay follows grammar and usage rules throughout the paper. Spelling and punctuation are correct
      throughout the paper." Score only the language rubric: how fully the essay meets this explanation.
      Content and organization are scored separately.'
    state:
    - essay_prompt
    - essay
    levels:
    - '1.0 out of 5.0 (lowest score): the essay does not meet the language rubric explanation.'
    - 1.5 out of 5.0
    - 2.0 out of 5.0
    - 2.5 out of 5.0
    - '3.0 out of 5.0 (midpoint): the essay partly meets the language rubric explanation.'
    - 3.5 out of 5.0
    - 4.0 out of 5.0
    - 4.5 out of 5.0
    - '5.0 out of 5.0 (highest score): The writing displays sophisticated control of a wide range of vocabulary
      and collocations. The essay follows grammar and usage rules throughout the paper. Spelling and punctuation
      are correct throughout the paper.'
    outcomes:
    - label: '1.0'
    - label: '1.5'
    - label: '2.0'
    - label: '2.5'
    - label: '3.0'
    - label: '3.5'
    - label: '4.0'
    - label: '4.5'
    - label: '5.0'
    cutoffs:
    - 0.5
    - 1.5
    - 2.5
    - 3.5
    - 4.5
    - 5.5
    - 6.5
    - 7.5
