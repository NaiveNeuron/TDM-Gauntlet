# DREsS_New (Yoo et al., ACL 2025), rubric LANGUAGE: EFL essay score 1.0-5.0 in 0.5 steps.
# Data: `uv run jev-opt/experiments/dress_new/prepare.py` (see ../README.md). Metric: QWK over the 9 levels.
name: dress-new-language
labels:   # descriptions: the gauntlet prompt's criteria (prompts/dress_new.json)
  "1.0": "1.0 out of 5.0 (lowest score): the essay does not meet the language rubric explanation."
  "1.5": "1.5 out of 5.0"
  "2.0": "2.0 out of 5.0"
  "2.5": "2.5 out of 5.0"
  "3.0": "3.0 out of 5.0 (midpoint): the essay partly meets the language rubric explanation."
  "3.5": "3.5 out of 5.0"
  "4.0": "4.0 out of 5.0"
  "4.5": "4.5 out of 5.0"
  "5.0": "5.0 out of 5.0 (highest score): The writing displays sophisticated control of a wide range of vocabulary and collocations. The essay follows grammar and usage rules throughout the paper. Spelling and punctuation are correct throughout the paper."
inputs:   # empty descriptions: the seed instructions describe the state, as in the gauntlet prompt
  essay_prompt: ""
  essay: ""
ordinal: true
data:
  train: data/language/train.jsonl
  val: data/language/val.jsonl
  test: data/language/test.jsonl
primary_metric: qwk
objectives: [quality, calibration, cheap, tokens]
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 16
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 5300   # ~14.1 full-val equivalents (val n=376) per optimizing condition
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive: [64, 256]
  fit_examples: 64
  calibrate: true
seed_program: seed_language.yaml
