# v3 dev study (third pre-registration). Generated from task_v2_organization_nodemo.yaml: same data, seed program
# (the gauntlet prompt, no demonstrations), metric, 400-example stratified train fit slice and val split.
# A = jev-zero with a readout head (L2 logistic regression; ridge + cutoffs for QWK) fitted on the fit slice,
#     hyperparameters by 5-fold CV.
# P = jev-population-opt from the union of the paper seed and 3 jev-native + 3 decomposed seeds written by
#     /jev-seeds from the task definition only (seeds_v3_organization/); 4 rounds x 20 proposed variants (<=1500 chars
#     per text field, <=2 aux questions, optional kNN demonstrations), packed requests, train-CV scoring; val picks
#     among the 4 best programs (top-single) and their forward-selected stacks under one readout (top-stacked);
#     every seed is also scored zero-shot (top-zero-<kind>). Fresh Jev spend <= $2 per run.
name: dress-new-organization
labels:
  '1.0': '1.0 out of 5.0 (lowest score): the essay does not meet the organization rubric explanation.'
  '1.5': 1.5 out of 5.0
  '2.0': 2.0 out of 5.0
  '2.5': 2.5 out of 5.0
  '3.0': '3.0 out of 5.0 (midpoint): the essay partly meets the organization rubric explanation.'
  '3.5': 3.5 out of 5.0
  '4.0': 4.0 out of 5.0
  '4.5': 4.5 out of 5.0
  '5.0': '5.0 out of 5.0 (highest score): The argument is very effectively structured and developed, making
    it easy for the reader to follow the ideas and understand how the writer is building the argument.
    Paragraphs use coherence devices effectively while focusing on a single main idea.'
inputs:
  essay_prompt: ''
  essay: ''
ordinal: true
data:
  train: data/organization/train.jsonl
  val: data/organization/val.jsonl
  test: data/organization/test.jsonl
primary_metric: qwk
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 5300
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  fit_holdout: true
  reflection_pool: 100
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: true
  readout_folds: 5
  population:
    size: 20
    rounds: 4
    elite: 4
    worst_examples: 8
    max_aux: 2
    val_candidates: 4
    stack_max: 4
    demos:
      mode: knn
      k: 8
      balanced: true
    max_jev_cost: 2.0
    max_tokens: 32000
    seeds:
    - kind: jev-native
      path: seeds_v3_organization/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3_organization/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3_organization/jev-native-3.yaml
    - kind: decomposed
      path: seeds_v3_organization/decomposed-1.yaml
    - kind: decomposed
      path: seeds_v3_organization/decomposed-2.yaml
    - kind: decomposed
      path: seeds_v3_organization/decomposed-3.yaml
seed_program: seed_organization.yaml
