# jev-tailored dev study (Jev-adapted GEPA), written by make_tailored_tasks.py from task_v3.yaml: same data,
# splits, metric, paper seed (the gauntlet prompt), 400-example stratified train fit slice, CV grouping and jev-
# native seeds (seeds_v3/, written from the task definition only). Ablation: start paper only, GEPA's default
# acceptance on 3-example minibatches (T2 off); everything else as task_tailored.yaml. OMP budget
# (max_reflection_cost) = the reflection spend of v1 study-ezstance-subtaskA-program ($2.1974); ablations: half
# of it, the paper start's share of the main run.
name: ezstance-subtaskA
labels:
  AGAINST: 'noun-phrase target: The author of the tweet is against the target. claim target: The author is definitely
    against the point or message from the claim.'
  FAVOR: 'noun-phrase target: The author of the tweet is in favor of the target. claim target: The author is definitely
    in favor of the point or message of the claim.'
  NONE: 'noun-phrase target: The author of the tweet is neutral toward the target. claim target: Based solely on
    the information from the tweet, we cannot know whether the author definitely supports or opposes the point or
    message of the claim.'
inputs:
  tweet: ''
  target: ''
  target_type: ''
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: macro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 40000
  reflection_minibatch_size: 3
  use_merge: false
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: false
  readout_folds: 5
  fit_parameters: true
  max_reflection_cost: 1.1
  tailored:
    starts:
    - paper
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    rulebook: true
    continuous_accept: false
    accept_n: 64
    accept_tol: 0.02
    confusion_target: true
    minimal_pairs: 4
    max_examples: 8
    max_jev_cost: 1.0
    head: true
seed_program: seed.yaml
