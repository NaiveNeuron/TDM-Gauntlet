# EZ-STANCE Subtask A (Zhao & Caragea, ACL 2024): tweet stance toward a noun-phrase or claim target.
# Data: `uv run jev-opt/experiments/ezstance_subtaskA/prepare.py` (see ../README.md).
# target_type is a routing field only (never sent to Jev). Metric: macro-F1 over the three stances.
name: ezstance-subtaskA
labels:   # descriptions: the gauntlet prompt's criteria (prompts/ezstance.json)
  "AGAINST": "noun-phrase target: The author of the tweet is against the target. claim target: The author is definitely against the point or message from the claim."
  "FAVOR": "noun-phrase target: The author of the tweet is in favor of the target. claim target: The author is definitely in favor of the point or message of the claim."
  "NONE": "noun-phrase target: The author of the tweet is neutral toward the target. claim target: Based solely on the information from the tweet, we cannot know whether the author definitely supports or opposes the point or message of the claim."
inputs:   # empty descriptions: the seed instructions describe the state, as in the gauntlet prompt
  tweet: ""
  target: ""
  target_type: ""
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: macro_f1
objectives: [quality, calibration, cheap, tokens]
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 16
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 14000   # ~14.0 full-val equivalents (val n=1000) per optimizing condition
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive: [64, 256]
  fit_examples: 64
  calibrate: true
seed_program: seed.yaml
