# Frozen-configuration round (final optimizer settings); generated by make_frozen_tasks.py, do not
# hand-edit. The v3 task file (smarter_implicit_hate/task_v3.yaml) with only the per-task
# fields replaced: name, labels (= the gauntlet prompt's criteria), inputs, primary metric, negative label,
# readout CV grouping, max_metric_calls = 14 x |val|. Seeds: 3 jev-native + 3 decomposed (/jev-seeds).
name: contempo-matres
labels:
  BEFORE: 'BEFORE: Event 1 starts before Event 2 starts. It is possible that the start time of Event 1
    is before the start time of Event 2 (A1=yes), and it is not possible that the start time of Event
    2 is before the start time of Event 1 (A2=no).'
  AFTER: 'AFTER: Event 1 starts after Event 2 starts. It is not possible that the start time of Event
    1 is before the start time of Event 2 (A1=no), and it is possible that the start time of Event 2 is
    before the start time of Event 1 (A2=yes).'
  EQUAL: 'EQUAL: Event 1 and Event 2 start at the same time. Neither start time can be before the other
    (A1=no, A2=no).'
  VAGUE: 'VAGUE: the text leaves the order of the two start times open. Both orders are possible: the
    start of Event 1 could be before the start of Event 2 (A1=yes), and the start of Event 2 could be
    before the start of Event 1 (A2=yes).'
inputs:
  context: ''
  event_1: ''
  event_2: ''
negative_label: VAGUE
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: micro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 14000
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  fit_holdout: true
  reflection_pool: 100
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: true
  readout_folds: 5
  population:
    size: 20
    rounds: 4
    elite: 4
    worst_examples: 8
    max_aux: 2
    val_candidates: 4
    stack_max: 4
    demos:
      mode: knn
      k: 8
      balanced: true
    max_jev_cost: 2.0
    max_tokens: 32000
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-1.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-2.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-3.yaml
  readout_group: '^fit:([^:]+):'
seed_program: seed.yaml
