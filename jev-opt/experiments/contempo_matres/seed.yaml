# jev-zero seed = the gauntlet's frozen prompt (prompts/contempo_matres.json), verbatim; generated by
# make_frozen_tasks.py, do not hand-edit. One Choice, question id `relation`, state {context, event_1, event_2} -- the gauntlet request.
version: 1
labels:
- BEFORE
- AFTER
- EQUAL
- VAGUE
inputs:
  context: ''
  event_1: ''
  event_2: ''
shared_state: false
temperature: 1.0
root: relation
nodes:
  relation:
    kind: choice
    instructions: 'Temporal relation classification between two events in a news text (MATRES scheme).
      The state holds "context": one sentence or two consecutive sentences from an English news article,
      in which the trigger word of Event 1 is wrapped in <e1>...</e1> and the trigger word of Event 2
      is wrapped in <e2>...</e2>; "event_1" and "event_2" repeat the two trigger words. Each trigger stands
      for the whole event it describes. Both events are anchored on the main time axis of the article
      (the actual story line), so they are temporally comparable. Compare only the START times of the
      two events; ignore when either event ends. Answer two questions: Q1 = Is it possible that the start
      time of Event 1 is before the start time of Event 2? Q2 = Is it possible that the start time of
      Event 2 is before the start time of Event 1? Let the answers be A1 and A2. Then we have a one-to-one
      mapping as follows: A1=A2=yes -> vague, A1=A2=no -> equal, A1=yes, A2=no -> before, and A1=no, A2=yes
      -> after. Choose the label for the relation of Event 1 (<e1>) to Event 2 (<e2>), in that order.'
    state:
    - context
    - event_1
    - event_2
    options:
      BEFORE:
        criterion: 'BEFORE: Event 1 starts before Event 2 starts. It is possible that the start time of
          Event 1 is before the start time of Event 2 (A1=yes), and it is not possible that the start
          time of Event 2 is before the start time of Event 1 (A2=no).'
      AFTER:
        criterion: 'AFTER: Event 1 starts after Event 2 starts. It is not possible that the start time
          of Event 1 is before the start time of Event 2 (A1=no), and it is possible that the start time
          of Event 2 is before the start time of Event 1 (A2=yes).'
      EQUAL:
        criterion: 'EQUAL: Event 1 and Event 2 start at the same time. Neither start time can be before
          the other (A1=no, A2=no).'
      VAGUE:
        criterion: 'VAGUE: the text leaves the order of the two start times open. Both orders are possible:
          the start of Event 1 could be before the start of Event 2 (A1=yes), and the start of Event 2
          could be before the start of Event 1 (A2=yes).'
