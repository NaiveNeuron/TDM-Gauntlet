# jev-native seed 2 (jev-opt /jev-seeds; writer anthropic/claude-opus-5-5; zero-shot: written from the task definition only)
# rationale: Minimal literal definitions from the paper, each paired with a single one-sentence boundary rule against its nearest neighbour.
version: 1
labels:
- Not Hate
- Explicit Hate
- Implicit Hate
inputs:
  post: ''
shared_state: true
temperature: 1.0
root: label
nodes:
  label:
    kind: choice
    instructions: Classify the hatefulness of the Twitter post in `post`. User mentions appear as <user>,
      and URLs have been removed.
    state:
    - post
    options:
      Not Hate:
        criterion: 'The `post` contains no form of hatred, prejudice or discrimination toward individuals
          or groups based on their characteristics. Boundary: negative or rude content that is not tied
          to a group characteristic belongs here.'
      Explicit Hate:
        criterion: 'The `post` contains openly expressed, direct hatred or prejudice toward individuals
          or groups based on their characteristics. Boundary: the hostility is readable from the literal
          words, without decoding.'
      Implicit Hate:
        criterion: 'The `post` uses coded or indirect language that disparages a person or group based
          on protected characteristics like race, gender and cultural identity. Boundary: the disparagement
          is real but only implied, and the literal words are not openly hateful.'
