# v3 jev-native-zero (third pre-registration): jev-native seed jev-native-1, the kind's best zero-shot TRAIN score
# in v3-edit-intent-P, run exactly as written: no readout, bias, cutoff/threshold fit or temperature.
name: edit-intent
labels:
  Grammar: 'Surface, fix grammar (Grammar): Correct grammatical errors, capitalization, punctuation, tense,
    modality, spelling, typography, abbreviations or any errors related to grammar and/or conventions
    to improve the language.'
  Clarity: 'Surface, improve clarity (Clarity): Alter word choice, phrase usage, expressions and/or text
    format to be more formal, concise and understandable without meaning changes, or to amplify meaning
    for clarity.'
  Fact/Evidence: 'Semantic, change factual information (Fact/Evidence): Add, elaborate, extend, verify
    or update the fact and/or evidence from third parties, or the author''s factual manipulations and
    observations, or delete/modify erroneous/irrelevant ones.'
  Claim: 'Semantic, change claim or statement (Claim): Change/Add/Delete the claim, statement, opinion,
    idea of the authors, or their overall aim of the document.'
  Other: 'Other: Revise the text in a way that is irrelevant to any other type of edit intent.'
inputs:
  edit_action: ''
  old_text: ''
  new_text: ''
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: macro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 14000
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: false
  fit_holdout: true
  reflection_pool: 100
  class_bias: false
  max_component_chars: 1500
  max_program_chars: 40000
  readout: false
  readout_folds: 5
  fit_parameters: false
seed_program: seeds_v3/jev-native-1.yaml
