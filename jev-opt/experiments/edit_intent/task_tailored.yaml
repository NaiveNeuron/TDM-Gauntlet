# jev-tailored dev study (Jev-adapted GEPA), written by make_tailored_tasks.py from task_v3.yaml: same data,
# splits, metric, paper seed (the gauntlet prompt), 400-example stratified train fit slice, CV grouping and jev-
# native seeds (seeds_v3/, written from the task definition only). GEPA text search per start (paper; the jev-
# native seed with the best zero-shot train score) with the Jev rulebook (T1), acceptance on 64 stratified train
# examples by mean log P(gold) with a 2-point metric guard (T2), joint rewrites of the most confused, least
# separable option pair (T3), minimal pairs (T4), candidates scored after out-of-fold class biases / cutoffs
# (T6). GEPA merge off (merges would bypass T2). OMP budget (max_reflection_cost) = the reflection spend of v1
# study-edit-intent-program ($2.9000).
name: edit-intent
labels:
  Grammar: 'Surface, fix grammar (Grammar): Correct grammatical errors, capitalization, punctuation, tense, modality,
    spelling, typography, abbreviations or any errors related to grammar and/or conventions to improve the language.'
  Clarity: 'Surface, improve clarity (Clarity): Alter word choice, phrase usage, expressions and/or text format
    to be more formal, concise and understandable without meaning changes, or to amplify meaning for clarity.'
  Fact/Evidence: 'Semantic, change factual information (Fact/Evidence): Add, elaborate, extend, verify or update
    the fact and/or evidence from third parties, or the author''s factual manipulations and observations, or delete/modify
    erroneous/irrelevant ones.'
  Claim: 'Semantic, change claim or statement (Claim): Change/Add/Delete the claim, statement, opinion, idea of
    the authors, or their overall aim of the document.'
  Other: 'Other: Revise the text in a way that is irrelevant to any other type of edit intent.'
inputs:
  edit_action: ''
  old_text: ''
  new_text: ''
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: macro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 40000
  reflection_minibatch_size: 3
  use_merge: false
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: false
  readout_folds: 5
  fit_parameters: true
  max_reflection_cost: 2.9
  tailored:
    starts:
    - paper
    - jev-native
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    rulebook: true
    continuous_accept: true
    accept_n: 64
    accept_tol: 0.02
    confusion_target: true
    minimal_pairs: 4
    max_examples: 8
    max_jev_cost: 2.0
    head: true
seed_program: seed.yaml
