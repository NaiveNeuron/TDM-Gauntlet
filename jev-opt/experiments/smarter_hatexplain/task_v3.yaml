# Frozen-configuration round (final optimizer settings); generated by make_frozen_tasks.py, do not
# hand-edit. The v3 task file (smarter_implicit_hate/task_v3.yaml) with only the per-task
# fields replaced: name, labels (= the gauntlet prompt's criteria), inputs, primary metric, negative label,
# readout CV grouping, max_metric_calls = 14 x |val|. Seeds: 3 jev-native + 3 decomposed (/jev-seeds).
name: smarter-hatexplain
labels:
  Normal: 'Normal: neither hate speech nor offensive.'
  Offensive: 'Offensive Language: usage of rude, hurtful, derogatory, obscene or insulting language to
    upset or embarrass people.'
  Hate: 'Hate Speech: language which attacks, demeans, offends, threatens, or insults a group based on
    race, ethnic origin, religion, disability, gender, age, sexual orientation, or other traits. it is
    not the presence of certain words that makes the text hate speech, rather you should look the context
    the word is used in the text.'
inputs:
  post: ''
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: macro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 14000
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  fit_holdout: true
  reflection_pool: 100
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: true
  readout_folds: 5
  population:
    size: 20
    rounds: 4
    elite: 4
    worst_examples: 8
    max_aux: 2
    val_candidates: 4
    stack_max: 4
    demos:
      mode: knn
      k: 8
      balanced: true
    max_jev_cost: 2.0
    max_tokens: 32000
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-1.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-2.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-3.yaml
seed_program: seed.yaml
