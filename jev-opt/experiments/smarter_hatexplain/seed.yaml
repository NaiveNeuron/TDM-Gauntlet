# jev-zero seed = the gauntlet's frozen prompt (prompts/smarter_hatexplain.json), verbatim; generated by
# make_frozen_tasks.py, do not hand-edit. One Choice, question id `label`, state {post} -- the gauntlet request.
version: 1
labels:
- Normal
- Offensive
- Hate
inputs:
  post: ''
shared_state: false
temperature: 1.0
root: label
nodes:
  label:
    kind: choice
    instructions: 'By considering their corresponding Definitions, label the following post with only
      one of these categories: Normal, Offensive, Hate. The state holds one social media post ("post")
      from Gab or Twitter, as released in HateXplain: lowercased and tokenised, with placeholders such
      as <user> and <number>.'
    state:
    - post
    options:
      Normal:
        criterion: 'Normal: neither hate speech nor offensive.'
      Offensive:
        criterion: 'Offensive Language: usage of rude, hurtful, derogatory, obscene or insulting language
          to upset or embarrass people.'
      Hate:
        criterion: 'Hate Speech: language which attacks, demeans, offends, threatens, or insults a group
          based on race, ethnic origin, religion, disability, gender, age, sexual orientation, or other
          traits. it is not the presence of certain words that makes the text hate speech, rather you
          should look the context the word is used in the text.'
