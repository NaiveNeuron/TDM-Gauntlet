# jev-tailored dev study (Jev-adapted GEPA), written by make_tailored_tasks.py from task_v3.yaml: same data,
# splits, metric, paper seed (the gauntlet prompt), 400-example stratified train fit slice, CV grouping and jev-
# native seeds (seeds_v3/, written from the task definition only). Ablation: start paper only, no rulebook (T1
# off); everything else as task_tailored.yaml. OMP budget (max_reflection_cost) = the reflection spend of v1
# study-smarter-implicit-hate-program ($1.5358); ablations: half of it, the paper start's share of the main run.
name: smarter-implicit-hate
labels:
  White Grievance: 'White Grievance: includes frustration over a minority groups'' perceived privilege and casting
    majority groups as the real victims of racism. This language is linked to extremist behavior and support for
    violence.'
  Incitement to Violence: 'Incitement to Violence: includes flaunting in group unity and power or elevating known
    hate groups and ideologies'
  Inferiority Language: 'Inferiority Language: implies one group or individual is inferior to another, and it can
    include dehumanization, denial of a person''s humanity, and toxic language that compares the target with disease,
    insects, animals. Related to assaults on human dignity, dominance, and declarations of superiority of the in
    group.'
  Irony: 'Irony: refers to the use of sarcasm , humor, and satire to attack or demean a protected class or individual.'
  Stereotypes and Misinformation: 'Stereotypes And Misinformation: associate a protected class with negative attributes
    such as crime, or terrorism. includes misinformation that feeds stereotypes and vice versa, like Holocaust denial
    and other forms of historical negationism.'
  Threatening and Intimidation: 'Threatening And Intimidation: conveys a speaker''s commitment to a target''s pain,
    injury, damage, loss or violation of rights, threats related to implicit violation of rights and freedoms, removal
    of opportunities, and more subtle forms of intimidation.'
inputs:
  post: ''
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: macro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 40000
  reflection_minibatch_size: 3
  use_merge: false
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: false
  readout_folds: 5
  fit_parameters: true
  max_reflection_cost: 0.77
  tailored:
    starts:
    - paper
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    rulebook: false
    continuous_accept: true
    accept_n: 64
    accept_tol: 0.02
    confusion_target: true
    minimal_pairs: 4
    max_examples: 8
    max_jev_cost: 1.0
    head: true
seed_program: seed.yaml
