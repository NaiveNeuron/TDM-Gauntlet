# v3 dev study (third pre-registration). Generated from task_v2_nodemo.yaml: same data, seed program
# (the gauntlet prompt, no demonstrations), metric, 400-example stratified train fit slice and val split.
# A = jev-zero with a readout head (L2 logistic regression; ridge + cutoffs for QWK) fitted on the fit slice,
#     hyperparameters by 5-fold CV.
# P = jev-population-opt from the union of the paper seed and 3 jev-native + 3 decomposed seeds written by
#     /jev-seeds from the task definition only (seeds_v3/); 4 rounds x 20 proposed variants (<=1500 chars
#     per text field, <=2 aux questions, optional kNN demonstrations), packed requests, train-CV scoring; val picks
#     among the 4 best programs (top-single) and their forward-selected stacks under one readout (top-stacked);
#     every seed is also scored zero-shot (top-zero-<kind>). Fresh Jev spend <= $2 per run.
name: smarter-implicit-hate
labels:
  White Grievance: 'White Grievance: includes frustration over a minority groups'' perceived privilege
    and casting majority groups as the real victims of racism. This language is linked to extremist behavior
    and support for violence.'
  Incitement to Violence: 'Incitement to Violence: includes flaunting in group unity and power or elevating
    known hate groups and ideologies'
  Inferiority Language: 'Inferiority Language: implies one group or individual is inferior to another,
    and it can include dehumanization, denial of a person''s humanity, and toxic language that compares
    the target with disease, insects, animals. Related to assaults on human dignity, dominance, and declarations
    of superiority of the in group.'
  Irony: 'Irony: refers to the use of sarcasm , humor, and satire to attack or demean a protected class
    or individual.'
  Stereotypes and Misinformation: 'Stereotypes And Misinformation: associate a protected class with negative
    attributes such as crime, or terrorism. includes misinformation that feeds stereotypes and vice versa,
    like Holocaust denial and other forms of historical negationism.'
  Threatening and Intimidation: 'Threatening And Intimidation: conveys a speaker''s commitment to a target''s
    pain, injury, damage, loss or violation of rights, threats related to implicit violation of rights
    and freedoms, removal of opportunities, and more subtle forms of intimidation.'
inputs:
  post: ''
data:
  train: data/train.jsonl
  val: data/val.jsonl
  test: data/test.jsonl
primary_metric: macro_f1
objectives:
- quality
- calibration
- cheap
- tokens
jev:
  model: typesafe/jev-1.13
  max_rpm: 1800
  concurrency: 32
optimizer:
  model: current
  reflection_model: null
  structural_model: null
  thinking: null
  max_metric_calls: 14000
  reflection_minibatch_size: 3
  use_merge: true
  seed: 0
  progressive:
  - 64
  - 256
  fit_examples: 400
  calibrate: true
  fit_holdout: true
  reflection_pool: 100
  class_bias: true
  max_component_chars: 1500
  max_program_chars: 40000
  readout: true
  readout_folds: 5
  population:
    size: 20
    rounds: 4
    elite: 4
    worst_examples: 8
    max_aux: 2
    val_candidates: 4
    stack_max: 4
    demos:
      mode: knn
      k: 8
      balanced: true
    max_jev_cost: 2.0
    max_tokens: 32000
    seeds:
    - kind: jev-native
      path: seeds_v3/jev-native-1.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-2.yaml
    - kind: jev-native
      path: seeds_v3/jev-native-3.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-1.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-2.yaml
    - kind: decomposed
      path: seeds_v3/decomposed-3.yaml
seed_program: seed.yaml
